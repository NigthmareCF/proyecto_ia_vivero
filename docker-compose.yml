services:
  db:
    image: postgres:16-alpine
    container_name: vivero_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vivero_db}
      POSTGRES_USER: ${DB_USERNAME:-vivero_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vivero_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vivero_user} -d ${DB_NAME:-vivero_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivero_network

  backend:
    build:
      context: ./vivero-backend
      dockerfile: Dockerfile
    container_name: vivero_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vivero_db}
      DB_USERNAME: ${DB_USERNAME:-vivero_user}
      DB_PASSWORD: ${DB_PASSWORD:-vivero_pass}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      IMAGES_PATH: ${IMAGES_PATH:-/app/images}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@vivero.com}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-false}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_ENVELOPE_FROM: ${MAIL_SMTP_ENVELOPE_FROM:-${MAIL_FROM:-noreply@vivero.com}}
      MAIL_SMTP_LOCALHOST: ${MAIL_SMTP_LOCALHOST:-}
      MAIL_SMTP_CONNECTION_TIMEOUT_MS: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:-10000}
      MAIL_SMTP_TIMEOUT_MS: ${MAIL_SMTP_TIMEOUT_MS:-15000}
      MAIL_SMTP_WRITE_TIMEOUT_MS: ${MAIL_SMTP_WRITE_TIMEOUT_MS:-15000}
      VISION_API_ENABLED: ${VISION_API_ENABLED:-false}
      VISION_API_PROVIDER: ${VISION_API_PROVIDER:-gemini}
      VISION_API_MODEL: ${VISION_API_MODEL:-gemini-2.5-flash}
      VISION_API_TIMEOUT_SECONDS: ${VISION_API_TIMEOUT_SECONDS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - images_data:/app/images
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - vivero_network

  frontend:
    build:
      context: ./vivero-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/api/ws}
    container_name: vivero_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - vivero_network

volumes:
  postgres_data:
    driver: local
  images_data:
    driver: local

networks:
  vivero_network:
    driver: bridge

