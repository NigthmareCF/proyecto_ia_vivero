# ══════════════════════════════════════════════════════
# application.yml — Vivero Backend
# Active profile: dev  (PostgreSQL via Docker)
# Test profile:   test (H2 in-memory, no disk writes)
# ══════════════════════════════════════════════════════

spring:
  application:
    name: vivero-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

# ══════════════════════════════════════════════════════
# PROFILE: dev — PostgreSQL via Docker Compose
# ══════════════════════════════════════════════════════
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:vivero_db}
    username: ${DB_USERNAME:vivero_user}
    password: ${DB_PASSWORD:vivero_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

# ══════════════════════════════════════════════════════
# PROFILE: test — H2 in-memory for unit tests
# ══════════════════════════════════════════════════════
---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:vivero_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

# ══════════════════════════════════════════════════════
# SERVER
# ══════════════════════════════════════════════════════
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# ══════════════════════════════════════════════════════
# APPLICATION PROPERTIES
# ══════════════════════════════════════════════════════
app:
  jwt:
    secret: ${JWT_SECRET:vivero-secret-key-2026-agrotech-robot-greenhouse-monitoring}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}           # 24 horas
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días

  storage:
    images-path: ${IMAGES_PATH:/app/images}

  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  notification:
    email:
      from: ${MAIL_FROM:noreply@vivero.com}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-whatsapp: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
      from-sms: ${TWILIO_SMS_FROM:}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      bot-username: ${TELEGRAM_BOT_USERNAME:ViveroBot}

# ══════════════════════════════════════════════════════
# SPRING MAIL
# ══════════════════════════════════════════════════════
spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

# ══════════════════════════════════════════════════════
# LOGGING
# ══════════════════════════════════════════════════════
logging:
  level:
    com.vivero: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# ══════════════════════════════════════════════════════
# ACTUATOR (Docker healthcheck)
# ══════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
