# ========================================================
# application.yml - Vivero Backend
# Active profile: dev  (PostgreSQL)
# Test profile:   test (H2 in-memory)
# ========================================================

spring:
  application:
    name: vivero-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:vivero-secret-key-2026-agrotech-robot-greenhouse-monitoring}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  storage:
    images-path: ${IMAGES_PATH:/app/images}

  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080/api}

  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  notification:
    email:
      from: ${MAIL_FROM:noreply@vivero.com}

logging:
  level:
    com.vivero: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

vision:
  api:
    enabled: ${VISION_API_ENABLED:false}
    provider: ${VISION_API_PROVIDER:gemini}
    model: ${VISION_API_MODEL:gemini-2.5-flash}
    timeout-seconds: ${VISION_API_TIMEOUT_SECONDS:30}
    gemini:
      key: ${GEMINI_API_KEY:}
      url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    local-vlm:
      enabled: ${VISION_LOCAL_VLM_ENABLED:false}
      url: ${VISION_LOCAL_VLM_URL:http://localhost:8000/v1}
      model: ${VISION_LOCAL_VLM_MODEL:qwen-vl-local}
      timeout-seconds: ${VISION_LOCAL_VLM_TIMEOUT_SECONDS:120}
    patrol:
      classifier-enabled: ${VISION_PATROL_CLASSIFIER_ENABLED:true}
      gemini-report-enabled: ${VISION_PATROL_GEMINI_REPORT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:vivero_db}
    username: ${DB_USERNAME:vivero_user}
    password: ${DB_PASSWORD:vivero_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:vivero_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
