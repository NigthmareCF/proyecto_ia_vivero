# ══════════════════════════════════════════════════════
# docker-compose.yml — Robot AgroTech Vivero
# Services: backend · db · robot-bridge · frontend
#
# Start all:      docker compose up --build
# Backend only:   docker compose up backend db
# View logs:      docker compose logs -f backend
# Stop all:       docker compose down
# Wipe volumes:   docker compose down -v
# ══════════════════════════════════════════════════════

version: "3.9"

services:

  # -- PostgreSQL Database ------------------------------
  db:
    image: postgres:16-alpine
    container_name: vivero_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vivero_db
      POSTGRES_USER: vivero_user
      POSTGRES_PASSWORD: vivero_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persistent data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivero_user -d vivero_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivero_net

  # -- Spring Boot Backend ------------------------------
  backend:
    build:
      context: ./vivero-backend
      dockerfile: Dockerfile
    container_name: vivero_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: "vivero-secret-key-2026-agrotech-change-in-production"
      IMAGES_PATH: /app/images
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@vivero.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ViveroBot}
    ports:
      - "8080:8080"
    volumes:
      - images_data:/app/images    # persistent image storage
    networks:
      - vivero_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # -- Robot Bridge (Python FastAPI) --------------------
  # Bridge between the physical robot (Raspberry Pi) and the Java backend.
  # The robot sends images and receives commands through this service.
  robot-bridge:
    build:
      context: ./robot-bridge
      dockerfile: Dockerfile
    container_name: vivero_robot_bridge
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080/api
      BRIDGE_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - images_data:/app/images
    networks:
      - vivero_net

  # -- React Frontend -----------------------------------
  frontend:
    build:
      context: ./vivero-frontend
      dockerfile: Dockerfile
    container_name: vivero_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_WS_URL: ws://localhost:8080/api/ws
    ports:
      - "3000:3000"
    networks:
      - vivero_net

# ══════════════════════════════════════════════════════
# VOLUMES — persistent data survives container restarts
# ══════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
    name: vivero_postgres_data

  images_data:
    driver: local
    name: vivero_images_data

# ══════════════════════════════════════════════════════
# INTERNAL NETWORK
# ══════════════════════════════════════════════════════
networks:
  vivero_net:
    driver: bridge
    name: vivero_network
