services:
  db:
    image: postgres:16-alpine
    container_name: vivero_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vivero_db}
      POSTGRES_USER: ${DB_USERNAME:-vivero_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vivero_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vivero_user} -d ${DB_NAME:-vivero_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivero_network

  backend:
    build:
      context: ./vivero-backend
      dockerfile: Dockerfile
    container_name: vivero_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vivero_db}
      DB_USERNAME: ${DB_USERNAME:-vivero_user}
      DB_PASSWORD: ${DB_PASSWORD:-vivero_pass}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      IMAGES_PATH: ${IMAGES_PATH:-/app/images}
      VISION_API_ENABLED: ${VISION_API_ENABLED:-false}
      VISION_API_PROVIDER: ${VISION_API_PROVIDER:-gemini}
      VISION_API_MODEL: ${VISION_API_MODEL:-gemini-2.5-flash}
      VISION_API_TIMEOUT_SECONDS: ${VISION_API_TIMEOUT_SECONDS:-45}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models}
      VISION_LOCAL_VLM_ENABLED: ${VISION_LOCAL_VLM_ENABLED:-true}
      VISION_LOCAL_VLM_URL: ${VISION_LOCAL_VLM_URL:-http://vlm-qwen:8000/v1}
      VISION_LOCAL_VLM_MODEL: ${VISION_LOCAL_VLM_MODEL:-qwen-vl-local}
      VISION_LOCAL_VLM_TIMEOUT_SECONDS: ${VISION_LOCAL_VLM_TIMEOUT_SECONDS:-120}
      VISION_PATROL_CLASSIFIER_ENABLED: ${VISION_PATROL_CLASSIFIER_ENABLED:-true}
      VISION_PATROL_GEMINI_REPORT_ENABLED: ${VISION_PATROL_GEMINI_REPORT_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@vivero.com}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
    volumes:
      - images_data:/app/images
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - vivero_network

  vlm-qwen:
    image: ${VLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: vivero_vlm_qwen
    restart: unless-stopped
    ipc: host
    gpus: all
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${VLM_QWEN_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      - --served-model-name
      - ${VLM_SERVED_MODEL_NAME:-qwen-vl-local}
      - --quantization
      - ${VLM_QUANTIZATION:-awq}
      - --trust-remote-code
      - --max-model-len
      - ${VLM_MAX_MODEL_LEN:-8192}
      - --limit-mm-per-prompt
      - '{"image":3,"video":0}'
    volumes:
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8000"
    networks:
      - vivero_network

  frontend:
    build:
      context: ./vivero-frontend
      dockerfile: Dockerfile.vm
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/api/ws}
    container_name: vivero_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${VM_FRONTEND_PORT:-80}:80"
      - "${VM_FRONTEND_EXTRA_PORT:-3000}:80"
    networks:
      - vivero_network

volumes:
  postgres_data:
    driver: local
  images_data:
    driver: local
  hf_cache:
    driver: local

networks:
  vivero_network:
    driver: bridge
